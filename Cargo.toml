[workspace]
members = [
    "crates/sandboxwich-agent",
    "crates/sandboxwich-api",
    "crates/sandboxwich-bench",
    "crates/sandboxwich-cli",
    "crates/sandboxwich-core",
    "crates/sandboxwich-worker",
]
resolver = "3"

[workspace.package]
# Single source of truth for the version of every crate in this workspace:
# each crate sets `version.workspace = true`, and release-plz bumps this one
# field (and the changelog) in its release PR.
version = "0.1.13"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/evalops/sandboxwich"
rust-version = "1.95"
homepage = "https://github.com/evalops/sandboxwich"
authors = ["EvalOps contributors"]

# Verified against this tree: `cargo build/test --workspace --all-targets`
# and `cargo clippy --workspace --all-targets -- -D warnings` are clean,
# and no `unsafe` blocks exist anywhere, so this floor is enforceable.
# Two pre-existing clippy findings that don't have a clean mechanical fix
# are silenced at their call site instead of here (see the CI PR body for
# details): `enum_variant_names` on the CLI's `Command::Command` variant
# (renaming it would break the CLI's public subcommand name) and
# `too_many_arguments` on a wide test-only insert helper in
# sandboxwich-api's http_contract test.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
cap-std = "4.0.2"
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
flate2 = "1.1"
clap = { version = "4.5", features = ["derive", "env"] }
ipnet = { version = "2.12", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustix = { version = "1.1", features = ["fs"] }
sandboxwich-core = { version = "0.1.13", path = "crates/sandboxwich-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
hmac = "0.12"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres", "sqlite", "chrono", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
# Test-only (dev-dependency of sandboxwich-api): `ServiceExt::oneshot` drives a
# `Router` through a middleware without binding a socket. Already in the lock
# file as an axum dependency, so this adds no new package.
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["serde", "v4", "v7"] }
utoipa = { version = "5.4", features = ["chrono", "uuid"] }
url = "2.5"
x509-parser = "0.18"
