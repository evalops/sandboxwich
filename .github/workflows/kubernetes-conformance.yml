name: kubernetes-conformance

# This live suite is intentionally post-merge only: it is too slow to run on
# every pull request, and the protected PR checks remain in ci.yml/containers.yml.
on:
  # The containers workflow publishes the exact commit's signed images. Wait
  # for that workflow so this suite can pull those images instead of rebuilding
  # the same four images a second time on a separate runner.
  workflow_run:
    workflows: [containers]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: evalops

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance-scope:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Require a successful container build
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" && "${CONCLUSION}" != "success" ]]; then
            echo "required=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # workflow_run is intentionally fed by a successful main-branch
          # container build. A main commit is the unit of conformance here;
          # the image pull below is keyed to this exact HEAD_SHA.
          echo "required=true" >> "${GITHUB_OUTPUT}"

  kind:
    needs: conformance-scope
    if: needs.conformance-scope.outputs.required == 'true'
    # GitHub-hosted: Blacksmith was dropped org-wide 2026-07-20. Public
    # repos cannot use the evalops-internal-arc scale set, and
    # evalops-private-ci (Hetzner) does not allow public repos either, so
    # ubuntu-latest is the only available runner for this post-merge run.
    # Expect it to run slower than the prior Blacksmith 8vcpu lane (kind went
    # 14m24s -> 6m26s on Blacksmith; GitHub-hosted is expected to land back in
    # the ~9-14m range).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        # The exact commit's service/runtime images were published by the
        # completed containers workflow immediately before this run.
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install pinned kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          echo c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  kind | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: Pull published images and build the conformance binary
        env:
          CONTAINER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # This debug binary runs directly on the runner (see
          # deploy/kubernetes/kind-conformance.sh's provider-apply-plan step)
          # rather than in a container, so it can't come from the published
          # (glibc-mismatched, --release) image builds below.
          cargo build -p sandboxwich-worker
          short_sha="${CONTAINER_SHA::12}"
          postgres_digest="$(sed -n 's/^FROM postgres:17@//p' deploy/kubernetes/postgres.Dockerfile)"
          images=(
            "${REGISTRY}/${IMAGE_NAMESPACE}/sandboxwich-api:sha-${short_sha}"
            "${REGISTRY}/${IMAGE_NAMESPACE}/sandboxwich-worker:sha-${short_sha}"
            "${REGISTRY}/${IMAGE_NAMESPACE}/sandboxwich-ubuntu-dev:sha-${short_sha}"
            "mirror.gcr.io/library/postgres@${postgres_digest}"
          )
          pull_pids=()
          for image in "${images[@]}"; do
            docker pull "${image}" &
            pull_pids+=("$!")
          done
          pull_status=0
          for pid in "${pull_pids[@]}"; do
            wait "${pid}" || pull_status=1
          done
          test "${pull_status}" -eq 0
          docker tag "${images[0]}" sandboxwich-api:conformance
          docker tag "${images[1]}" sandboxwich-worker:conformance
          docker tag "${images[2]}" sandboxwich-runtime:conformance
          docker tag "${images[3]}" postgres:conformance
      - name: Create disposable cluster
        run: >-
          kind create cluster --name sandboxwich-conformance
          --config deploy/kubernetes/kind-conformance.yaml --wait 120s
      - name: Publish digest-pinned runtime images to the disposable registry
        env:
          CONTAINER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          short_sha="${CONTAINER_SHA::12}"
          postgres_digest="$(sed -n 's/^FROM postgres:17@//p' deploy/kubernetes/postgres.Dockerfile)"
          # RepoDigests lists every registry that has this image ID. After a
          # pull from private GHCR plus a retag/push to the kind registry, that
          # list includes ghcr.io/...@sha256:... first. kind nodes have no GHCR
          # credentials, so crictl pull of a ghcr digest returns 401. Always
          # select the localhost:5001 digest the disposable registry just
          # published.
          local_repo_digest() {
            local ref="$1"
            local prefix="${ref%:*}"
            local digest
            digest="$(docker image inspect "${ref}" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | grep -F "${prefix}@" \
              | head -n1)"
            [[ "${digest}" == "${prefix}"@sha256:* ]]
            printf '%s\n' "${digest}"
          }
          # Pulled via the Docker Hub mirror to avoid docker.io's anonymous-pull
          # rate limit.
          docker run -d --restart=always -p 127.0.0.1:5001:5000 \
            --name sandboxwich-kind-registry mirror.gcr.io/library/registry:2
          docker network connect kind sandboxwich-kind-registry
          for node in $(kind get nodes --name sandboxwich-conformance); do
            docker exec "${node}" mkdir -p /etc/containerd/certs.d/localhost:5001
            printf '%s\n' \
              'server = "http://sandboxwich-kind-registry:5000"' \
              '[host."http://sandboxwich-kind-registry:5000"]' \
              '  capabilities = ["pull", "resolve"]' | \
              docker exec -i "${node}" tee \
                /etc/containerd/certs.d/localhost:5001/hosts.toml >/dev/null
          done
          # Publish and discard the largest local image first so the registry
          # never overlaps it with another redundant runtime image copy.
          docker tag sandboxwich-runtime:conformance \
            localhost:5001/sandboxwich-runtime:conformance
          docker push localhost:5001/sandboxwich-runtime:conformance
          runtime_image="$(local_repo_digest localhost:5001/sandboxwich-runtime:conformance)"
          docker image rm -f sandboxwich-runtime:conformance \
            localhost:5001/sandboxwich-runtime:conformance \
            "${REGISTRY}/${IMAGE_NAMESPACE}/sandboxwich-ubuntu-dev:sha-${short_sha}"
          docker image prune --force

          docker tag sandboxwich-worker:conformance \
            localhost:5001/sandboxwich-worker:conformance
          docker push localhost:5001/sandboxwich-worker:conformance
          gateway_image="$(local_repo_digest localhost:5001/sandboxwich-worker:conformance)"
          docker image rm -f sandboxwich-worker:conformance \
            localhost:5001/sandboxwich-worker:conformance \
            "${REGISTRY}/${IMAGE_NAMESPACE}/sandboxwich-worker:sha-${short_sha}"
          docker image prune --force

          docker tag sandboxwich-api:conformance \
            localhost:5001/sandboxwich-api:conformance
          docker push localhost:5001/sandboxwich-api:conformance
          api_image="$(local_repo_digest localhost:5001/sandboxwich-api:conformance)"
          docker image rm -f sandboxwich-api:conformance \
            localhost:5001/sandboxwich-api:conformance \
            "${REGISTRY}/${IMAGE_NAMESPACE}/sandboxwich-api:sha-${short_sha}"
          docker image prune --force

          docker tag postgres:conformance localhost:5001/postgres:conformance
          docker push localhost:5001/postgres:conformance
          postgres_image="$(local_repo_digest localhost:5001/postgres:conformance)"
          docker image rm -f postgres:conformance localhost:5001/postgres:conformance \
            "mirror.gcr.io/library/postgres@${postgres_digest}"
          docker image prune --force

          for node in $(kind get nodes --name sandboxwich-conformance); do
            docker exec "${node}" crictl pull "${gateway_image}"
            docker exec "${node}" crictl pull "${runtime_image}"
          done
          {
            echo "SANDBOXWICH_API_IMAGE=${api_image}"
            echo "SANDBOXWICH_GATEWAY_IMAGE=${gateway_image}"
            echo "SANDBOXWICH_POSTGRES_IMAGE=${postgres_image}"
            echo "SANDBOXWICH_WORKER_IMAGE=${gateway_image}"
            echo "SANDBOXWICH_RUNTIME_IMAGE=${runtime_image}"
          } >>"${GITHUB_ENV}"
      - name: Run live conformance and chaos checks
        run: deploy/kubernetes/kind-conformance.sh
      - name: Collect cluster diagnostics
        if: failure()
        run: |
          kubectl get all -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp
          kubectl -n sandboxwich logs deployment/sandboxwich-api --tail=-1 --prefix || true
          kubectl -n sandboxwich logs deployment/sandboxwich-api --previous --tail=-1 --prefix || true
          kubectl -n sandboxwich logs deployment/sandboxwich-worker --tail=-1 --prefix || true
      - name: Delete disposable cluster
        if: always()
        run: |
          kind delete cluster --name sandboxwich-conformance
          docker rm -f sandboxwich-kind-registry >/dev/null 2>&1 || true

  cilium-fqdn:
    name: cilium-fqdn
    needs: conformance-scope
    if: needs.conformance-scope.outputs.required == 'true'
    # See the `kind` job above for the public-repo GitHub-hosted-lane reasoning.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install pinned kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          echo c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  kind | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: Build the worker that renders the policy under test
        # The suite applies this binary's `render-egress-policy` output, so it
        # exercises the shipped rendering instead of a copy of it.
        run: cargo build -p sandboxwich-worker
      - name: Create Cilium cluster
        run: kind create cluster --name sandboxwich-cilium --config deploy/kubernetes/kind-cilium.yaml
      - name: Install Cilium
        run: |
          helm repo add cilium https://helm.cilium.io/
          helm repo update
          helm install cilium cilium/cilium --version 1.17.6 --namespace kube-system \
            --set ipam.mode=kubernetes \
            --set kubeProxyReplacement=true \
            --set ipv6.enabled=true
          kubectl -n kube-system rollout status daemonset/cilium --timeout=300s
          kubectl wait nodes --all --for=condition=Ready --timeout=300s
          # Pods scheduled before the CNI was ready stay in ContainerCreating;
          # the suite needs cluster DNS to answer.
          kubectl -n kube-system delete pod -l k8s-app=kube-dns --wait=true --timeout=180s
          kubectl -n kube-system rollout status deployment/coredns --timeout=300s
      - name: Run Cilium FQDN conformance
        run: deploy/kubernetes/cilium-fqdn-conformance.sh
      - name: Collect Cilium diagnostics
        if: failure()
        run: |
          kubectl get nodes,pods -A -o wide
          kubectl -n kube-system logs daemonset/cilium --tail=200 || true
          kubectl get ciliumnetworkpolicies -A -o yaml || true
          kubectl get ciliumendpoints -A -o wide || true
          kubectl -n kube-system get configmap coredns -o yaml || true
      - name: Delete Cilium cluster
        if: always()
        run: kind delete cluster --name sandboxwich-cilium
