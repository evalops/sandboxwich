name: containers (validation only)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  container-scope:
    name: container scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Detect image changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files"
          if grep -Eq '^(\.dockerignore$|Dockerfile$|Cargo\.(toml|lock)$|rust-toolchain(\.toml)?$|\.cargo/|crates/|\.github/workflows/containers\.yml$)' "${RUNNER_TEMP}/changed-files"; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
          else
            echo "required=false" >> "${GITHUB_OUTPUT}"
          fi

  service-build:
    needs: container-scope
    if: needs.container-scope.outputs.required == 'true'
    name: service build (${{ matrix.bin }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: sandboxwich-api
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - bin: sandboxwich-api
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - bin: sandboxwich-worker
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - bin: sandboxwich-worker
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native service image without publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: BIN=${{ matrix.bin }}
          tags: sandboxwich-validation/${{ matrix.bin }}:${{ github.sha }}-${{ matrix.arch }}
          provenance: false
          sbom: false

  service-images:
    name: service image (${{ matrix.bin }})
    needs: [container-scope, service-build]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bin: [sandboxwich-api, sandboxwich-worker]
    steps:
      - name: Require native validation builds
        if: needs.container-scope.outputs.required == 'true'
        env:
          BUILD_RESULT: ${{ needs.service-build.result }}
        run: test "${BUILD_RESULT}" = success
      - name: Fail closed when scope detection failed
        if: needs.container-scope.result != 'success'
        run: exit 1
      - name: Skip native builds for unrelated changes
        if: needs.container-scope.outputs.required == 'false'
        run: echo 'image build not required for this pull request'

  runtime-image:
    name: runtime image (ubuntu-dev)
    needs: container-scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record Mono-owned runtime validation
        run: |
          test "${{ needs.container-scope.result }}" = success
          echo 'Standalone runtime publication and validation are retired.'
          echo 'Authoritative runtime validation runs from evalops/mono.'
