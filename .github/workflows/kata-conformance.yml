name: kata-conformance

# SW-3 live conformance for the `virtual_machine` execution class.
#
# Manual dispatch only, and deliberately not a required check: a Kata
# RuntimeClass needs a runtime handler backed by hardware (or nested)
# virtualization, which no GitHub-hosted runner provides. Wiring this on
# `pull_request` with the runners available today would produce a check that
# is green because it could not test anything -- exactly the unsupported
# certification claim docs/capabilities.md warns about.
#
# Run it against a disposable, Kata-capable cluster (see docs/kubernetes.md).
# A green run is the evidence required to promote the class; until this runs
# green on real Kata nodes, virtual_machine stays experimental.
#
# evalops/deploy provisions such a cluster with
# `scripts/sandboxwich-kata-conformance-cluster.sh create`, which also prints
# the dispatch below with the right inputs. See that repository's
# docs/operations/sandboxwich-kata-conformance.md.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Self-hosted runner label with kubectl access to a Kata-capable cluster
        required: true
        type: string
      kube_context:
        description: kubectl context of the disposable Kata cluster
        required: true
        type: string
      runtime_class:
        description: Kata RuntimeClass name
        required: false
        default: kata-qemu
        type: string
      storage_class:
        description: StorageClass for sandbox workspaces
        required: false
        default: standard
        type: string
      gke_cluster:
        description: >-
          Optional GKE cluster to fetch credentials for before the gate runs.
          Set this when the runner can reach the cluster but does not already
          hold its context, which is the normal case for a disposable cluster
          created after the runner started.
        required: false
        default: ""
        type: string
      gke_location:
        description: Zone or region of gke_cluster; required with gke_cluster
        required: false
        default: ""
        type: string
      gke_project:
        description: Project of gke_cluster; required with gke_cluster
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.kube_context }}
  cancel-in-progress: false

jobs:
  kata:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch credentials for the disposable cluster
        # Triggered by any of the three so that partial coordinates fail loudly
        # below instead of silently skipping the fetch and running the gate
        # against whatever context the runner happened to hold.
        if: inputs.gke_cluster != '' || inputs.gke_location != '' || inputs.gke_project != ''
        shell: bash
        env:
          GKE_CLUSTER: ${{ inputs.gke_cluster }}
          GKE_LOCATION: ${{ inputs.gke_location }}
          GKE_PROJECT: ${{ inputs.gke_project }}
          KUBE_CONTEXT: ${{ inputs.kube_context }}
        run: |
          set -euo pipefail
          for value in "${GKE_CLUSTER}" "${GKE_LOCATION}" "${GKE_PROJECT}"; do
            [[ -n "${value}" ]] || {
              echo "gke_cluster, gke_location and gke_project must be set together" >&2
              exit 1
            }
          done
          # Fetch into a per-run kubeconfig. The runner's shared one would keep
          # this context after the disposable cluster is deleted, and the check
          # below would then happily match that stale entry on a later run.
          kubeconfig="${RUNNER_TEMP}/kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export KUBECONFIG="${kubeconfig}"
          echo "KUBECONFIG=${kubeconfig}" >>"${GITHUB_ENV}"
          gcloud container clusters get-credentials "${GKE_CLUSTER}" \
            --location "${GKE_LOCATION}" --project "${GKE_PROJECT}"
          # The gate selects its cluster by context name only. If the fetched
          # credentials landed under a different name, every later step would
          # run against whatever else that name refers to.
          contexts="$(kubectl config get-contexts -o name)"
          grep -Fxq "${KUBE_CONTEXT}" <<<"${contexts}"
      - name: Resolve digest-pinned images from the deployed manifests
        shell: bash
        run: |
          set -euo pipefail
          # The conformance run must certify images that exist as published
          # digests, not locally built tags: a VM boundary proven for an
          # unpublished build certifies nothing operators can deploy.
          api_image="$(grep -o 'ghcr.io/evalops/sandboxwich-api@sha256:[0-9a-f]\{64\}' \
            deploy/kubernetes/api.yaml | head -n1)"
          worker_image="$(grep -o 'ghcr.io/evalops/sandboxwich-worker@sha256:[0-9a-f]\{64\}' \
            deploy/kubernetes/worker.yaml | head -n1)"
          runtime_image="$(grep -o 'ghcr.io/evalops/sandboxwich-ubuntu-dev@sha256:[0-9a-f]\{64\}' \
            deploy/kubernetes/worker.yaml | head -n1)"
          for image in "${api_image}" "${worker_image}" "${runtime_image}"; do
            [[ "${image}" == *@sha256:* ]] || {
              echo "could not resolve a digest-pinned image from the manifests" >&2
              exit 1
            }
          done
          {
            echo "SANDBOXWICH_API_IMAGE=${api_image}"
            echo "SANDBOXWICH_WORKER_IMAGE=${worker_image}"
            echo "SANDBOXWICH_GATEWAY_IMAGE=${worker_image}"
            echo "SANDBOXWICH_RUNTIME_IMAGE=${runtime_image}"
          } >>"${GITHUB_ENV}"
      - name: Run Kata (virtual_machine) conformance
        env:
          SANDBOXWICH_KUBE_CONTEXT: ${{ inputs.kube_context }}
          SANDBOXWICH_KATA_RUNTIME_CLASS: ${{ inputs.runtime_class }}
          SANDBOXWICH_STORAGE_CLASS: ${{ inputs.storage_class }}
        run: deploy/kubernetes/kata-conformance.sh
      - name: Collect cluster diagnostics
        if: failure()
        env:
          SANDBOXWICH_KUBE_CONTEXT: ${{ inputs.kube_context }}
        run: |
          kubectl --context "${SANDBOXWICH_KUBE_CONTEXT}" get all -A -o wide || true
          kubectl --context "${SANDBOXWICH_KUBE_CONTEXT}" get events -A --sort-by=.lastTimestamp || true
          kubectl --context "${SANDBOXWICH_KUBE_CONTEXT}" -n sandboxwich \
            logs deployment/sandboxwich-worker --tail=-1 --prefix || true
      - name: Delete conformance namespaces
        if: always()
        env:
          SANDBOXWICH_KUBE_CONTEXT: ${{ inputs.kube_context }}
        run: |
          kubectl --context "${SANDBOXWICH_KUBE_CONTEXT}" delete namespace \
            sandboxwich-sandboxes sandboxwich --ignore-not-found --wait=true || true
