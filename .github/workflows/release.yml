name: release (retired)

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: release automation retired
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        run: |
          echo "Sandboxwich releases are owned by evalops/mono." >&2
          echo "Use .github/workflows/sandboxwich-publish.yml in Mono." >&2
          exit 1
