---
# GH-76: sandboxes are provisioned into a dedicated namespace, separate
# from the control-plane namespace (sandboxwich) where the API, the
# sandboxwich-secrets Secret (SANDBOXWICH_DATABASE_URL, api-token), and the
# worker's own ServiceAccount live. The worker's RBAC below is scoped to
# this namespace only and grants nothing in the control-plane namespace,
# so a compromised worker (or an exec-path bug) cannot reach
# sandboxwich-api pods or the database credential.
apiVersion: v1
kind: Namespace
metadata:
  name: sandboxwich-sandboxes
  labels:
    app.kubernetes.io/part-of: sandboxwich
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandboxwich-worker
  namespace: sandboxwich
  labels:
    app.kubernetes.io/name: sandboxwich-worker
    app.kubernetes.io/part-of: sandboxwich
---
# NOTE: no Role/RoleBinding is granted to sandboxwich-worker in the
# sandboxwich (control-plane) namespace. All sandbox-manipulating
# permissions live in the sandboxwich-sandboxes Role/RoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandboxwich-worker
  namespace: sandboxwich-sandboxes
  labels:
    app.kubernetes.io/name: sandboxwich-worker
    app.kubernetes.io/part-of: sandboxwich
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - persistentvolumeclaims
      # GH-101: one Secret per sandbox, holding this worker's own
      # worker-scoped API token (GH-64), mounted read-only into that
      # sandbox's pod. Scoped to this namespace only, same as the other
      # sandbox-manipulating resources above -- a compromised worker can
      # still only touch secrets it creates in sandboxwich-sandboxes, never
      # the sandboxwich-secrets Secret in the control-plane namespace.
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # pods/exec is scoped to "create" only, and to this namespace, which
  # contains nothing but sandbox pods. RBAC has no per-resource wildcard
  # for the dynamically-generated sandbox pod names, so namespace
  # isolation (rather than resourceNames) is what keeps this from being
  # usable against control-plane pods (GH-76).
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs: ["create"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandboxwich-worker
  namespace: sandboxwich-sandboxes
  labels:
    app.kubernetes.io/name: sandboxwich-worker
    app.kubernetes.io/part-of: sandboxwich
subjects:
  - kind: ServiceAccount
    name: sandboxwich-worker
    namespace: sandboxwich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandboxwich-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandboxwich-reconciler
  namespace: sandboxwich
  labels:
    app.kubernetes.io/name: sandboxwich-reconciler
    app.kubernetes.io/part-of: sandboxwich
---
# Reconciliation is intentionally outside the worker Deployment. This role
# can observe and UID-fenced-delete sandbox resources, but cannot create,
# update, patch, exec into, or read logs from workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandboxwich-reconciler
  namespace: sandboxwich-sandboxes
  labels:
    app.kubernetes.io/name: sandboxwich-reconciler
    app.kubernetes.io/part-of: sandboxwich
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - persistentvolumeclaims
      - secrets
    verbs: ["get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandboxwich-reconciler
  namespace: sandboxwich-sandboxes
  labels:
    app.kubernetes.io/name: sandboxwich-reconciler
    app.kubernetes.io/part-of: sandboxwich
subjects:
  - kind: ServiceAccount
    name: sandboxwich-reconciler
    namespace: sandboxwich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandboxwich-reconciler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxwich-worker
  namespace: sandboxwich
  labels:
    app.kubernetes.io/name: sandboxwich-worker
    app.kubernetes.io/part-of: sandboxwich
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandboxwich-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandboxwich-worker
        app.kubernetes.io/part-of: sandboxwich
    spec:
      serviceAccountName: sandboxwich-worker
      # Must exceed --drain-timeout-secs below so Kubernetes doesn't SIGKILL
      # the worker mid-drain: on SIGTERM/SIGINT the worker stops claiming new
      # leases and waits for any in-flight lease to finish, bounded by that
      # timeout, before exiting on its own.
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/evalops/sandboxwich-worker@sha256:45e661306ead0b59435c1141ab6d120f4dbdbab6ef70cfcdc80ce758cae5d0b9
          imagePullPolicy: IfNotPresent
          env:
            # kubectl (shelled out to by the apply provider) wants a writable
            # $HOME for its discovery cache. readOnlyRootFilesystem below
            # means that has to be redirected to the /tmp emptyDir.
            - name: HOME
              value: /tmp
            - name: SANDBOXWICH_API
              value: http://sandboxwich-api.sandboxwich.svc:3217
            # GH-64: this tenant-wide credential authenticates only the
            # `run` subcommand's initial `POST /workers/register` call.
            # Immediately after registering, the worker process mints and
            # switches internally to a worker-scoped token bound to its own
            # worker id, and uses that (never this value) for every
            # guest-facing call it makes afterward (heartbeat, lease
            # claim/renew/complete/fail/output) -- those routes reject
            # tenant-wide tokens outright.
            - name: SANDBOXWICH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandboxwich-secrets
                  key: api-token
                  optional: true
            - name: SANDBOXWICH_TENANT
              value: default
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SANDBOXWICH_CLUSTER
              value: k3s-dev
            - name: SANDBOXWICH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # GH-76: sandboxes render into a dedicated namespace, separate
            # from SANDBOXWICH_NAMESPACE (the control-plane namespace the
            # worker pod itself runs in). Must match the Namespace/Role/
            # RoleBinding above.
            - name: SANDBOXWICH_SANDBOX_NAMESPACE
              value: sandboxwich-sandboxes
            - name: SANDBOXWICH_STORAGE_CLASS
              value: local-path
            - name: SANDBOXWICH_SNAPSHOT_CLASS
              value: ""
            - name: SANDBOXWICH_WORKSPACE_STORAGE
              value: 2Gi
            - name: SANDBOXWICH_SSH_AUTHORIZED_KEYS_SECRET
              value: ""
            - name: SANDBOXWICH_VNC_PASSWORD_SECRET
              value: ""
            - name: SANDBOXWICH_RUNTIME_CLASS_NAME
              value: ""
            # Typed isolation profile: development, gvisor or kata. It selects
            # the execution classes this worker advertises -- `gvisor` for
            # sandboxed_container and `kata` for virtual_machine -- and both of
            # those require the RuntimeClass above to be nonempty. A worker
            # never satisfies an execution class it is not configured for.
            - name: SANDBOXWICH_ISOLATION_PROFILE
              value: development
            # Optional provider-isolated orb-sidecar image. The worker advertises
            # that capability only when this is digest-pinned and the RuntimeClass
            # above is nonempty; the sidecar Pod uses that RuntimeClass too.
            - name: SANDBOXWICH_ISOLATED_RESIDENT_PROCESS_IMAGE
              value: ""
            # Optional comma-separated, narrow issuer CIDRs that only the
            # provider-isolated orb-sidecar may reach over TCP/443. IPv4
            # ranges must be /24 or narrower and IPv6 /64 or narrower;
            # metadata/link-local and other hard-forbidden ranges are rejected.
            - name: SANDBOXWICH_ISOLATED_SIDECAR_HTTPS_CIDRS
              value: ""
            - name: SANDBOXWICH_MAX_RESIDENT_PROCESSES
              value: "8"
            # Required in apply mode: the worker refuses to start without an
            # explicit guest image so kind/local clusters cannot silently fall
            # back to a private ghcr.io default and ImagePullBackOff.
            - name: SANDBOXWICH_RUNTIME_IMAGE
              value: ghcr.io/evalops/sandboxwich-ubuntu-dev@sha256:67beb010add51dd38455dc35b0e5103c73565c529f2efaa3f1ccac9015db79d2
            # Host-bearing sandboxes run this exact worker image as a
            # per-sandbox egress gateway. The worker rejects mutable tags.
            - name: SANDBOXWICH_EGRESS_GATEWAY_IMAGE
              value: ghcr.io/evalops/sandboxwich-worker@sha256:45e661306ead0b59435c1141ab6d120f4dbdbab6ef70cfcdc80ce758cae5d0b9
            # SECURITY NOTE (GH-76): this sets both halves of the mutation
            # double opt-in (this env var and --confirm-apply below)
            # permanently ON in this deployment. That is a deliberate,
            # documented choice, not an accident: the worker's entire job
            # in apply mode is to create/delete sandbox resources, so a
            # deployment of this manifest with the gate closed cannot
            # process any work. The gate still protects every other
            # context (local runs, CI, provider-apply-smoke), where both
            # halves must be supplied explicitly.
            #
            # The contract for operators of THIS manifest:
            #   - mutations are confined to the sandbox namespace above
            #     (sandboxwich-sandboxes) by the worker's RBAC; the gate is
            #     not what protects the control plane, the Role scoping is.
            #   - the worker logs a startup warning whenever both halves
            #     are force-enabled, so this state is visible in pod logs,
            #     not only in this comment.
            #   - to run a worker that can never mutate the cluster, remove
            #     this env var (or --confirm-apply) and switch
            #     --provider-mode to dry-run.
            - name: SANDBOXWICH_K8S_ENABLE_MUTATION
              value: "1"
          args:
            - run
            - --name
            - $(POD_NAME)
            - --provider
            - kubernetes
            - --provider-mode
            - apply
            - --confirm-apply
            - --kubectl-context
            - in-cluster
            - --cluster
            - $(SANDBOXWICH_CLUSTER)
            - --namespace
            - $(SANDBOXWICH_NAMESPACE)
            - --sandbox-namespace
            - $(SANDBOXWICH_SANDBOX_NAMESPACE)
            - --storage-class
            - $(SANDBOXWICH_STORAGE_CLASS)
            - --snapshot-class
            - $(SANDBOXWICH_SNAPSHOT_CLASS)
            - --workspace-storage
            - $(SANDBOXWICH_WORKSPACE_STORAGE)
            - --ssh-authorized-keys-secret
            - $(SANDBOXWICH_SSH_AUTHORIZED_KEYS_SECRET)
            - --vnc-password-secret
            - $(SANDBOXWICH_VNC_PASSWORD_SECRET)
            - --runtime-class-name
            - $(SANDBOXWICH_RUNTIME_CLASS_NAME)
            - --isolation-profile
            - $(SANDBOXWICH_ISOLATION_PROFILE)
            - --ingress-namespace
            - $(SANDBOXWICH_NAMESPACE)
            - --label
            - cluster=$(SANDBOXWICH_CLUSTER)
            - --label
            - pod=$(POD_NAME)
            # Kept comfortably under terminationGracePeriodSeconds above so the
            # worker's own drain logic (not Kubernetes' SIGKILL) is what ends
            # the process in the common case.
            - --drain-timeout-secs
            - "300"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sandboxwich-reconciler
  namespace: sandboxwich
  labels:
    app.kubernetes.io/name: sandboxwich-reconciler
    app.kubernetes.io/part-of: sandboxwich
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Register retries (up to 5 × ~10s connect timeout + backoff) plus
      # --orphan-reconciliation-max-elapsed-secs must fit inside this budget.
      # 180s was tight once control-plane connect blips burned the first
      # attempt and left no room for discovery/delete of large PVC residue.
      activeDeadlineSeconds: 360
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sandboxwich-reconciler
            app.kubernetes.io/part-of: sandboxwich
        spec:
          serviceAccountName: sandboxwich-reconciler
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciler
              image: ghcr.io/evalops/sandboxwich-worker@sha256:45e661306ead0b59435c1141ab6d120f4dbdbab6ef70cfcdc80ce758cae5d0b9
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
                - name: SANDBOXWICH_API
                  value: http://sandboxwich-api.sandboxwich.svc:3217
                - name: SANDBOXWICH_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: sandboxwich-secrets
                      key: api-token
                      optional: true
                - name: SANDBOXWICH_TENANT
                  value: default
                - name: SANDBOXWICH_CLUSTER
                  value: k3s-dev
                - name: SANDBOXWICH_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SANDBOXWICH_SANDBOX_NAMESPACE
                  value: sandboxwich-sandboxes
                - name: SANDBOXWICH_K8S_ENABLE_MUTATION
                  value: "1"
                - name: SANDBOXWICH_ORPHAN_RECONCILIATION_APPLY
                  value: "1"
              args:
                - reconcile
                - --name
                - sandboxwich-reconciler
                - --provider
                - kubernetes
                - --confirm-apply
                - --kubectl-context
                - in-cluster
                - --cluster
                - $(SANDBOXWICH_CLUSTER)
                - --namespace
                - $(SANDBOXWICH_NAMESPACE)
                - --sandbox-namespace
                - $(SANDBOXWICH_SANDBOX_NAMESPACE)
                - --orphan-reconciliation-max-scanned
                - "20000"
                - --orphan-reconciliation-max-deleted
                - "500"
                - --orphan-reconciliation-max-elapsed-secs
                - "120"
                - --orphan-reconciliation-apply
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 1
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir: {}
